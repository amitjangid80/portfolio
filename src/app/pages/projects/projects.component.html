<div class="max-w-300 mx-auto px-4 md:px-10 py-10 md:py-20 flex flex-col gap-10">
  <header appReveal class="flex flex-col gap-4">
    <div class="inline-flex items-center gap-2 bg-primary/10 border border-primary/20 rounded-full px-4 py-1.5 w-fit">
      <app-icon name="terminal" [size]="18" extraClass="text-primary" />
      <span class="font-label text-sm text-primary uppercase tracking-widest">Module: Project_Archive</span>
    </div>
    <h1 class="font-display text-[40px] leading-12 md:text-[64px] md:leading-18 font-bold text-on-surface">
      System <span class="text-transparent bg-clip-text bg-linear-to-r from-primary to-secondary">Modules</span>
    </h1>
    <div class="flex items-center gap-4">
      <span class="h-px w-12 bg-primary"></span>
      <p class="font-label text-on-surface-variant text-sm tracking-widest uppercase">
        // Core infrastructure &amp; technical deployments
      </p>
    </div>
  </header>

  <section class="w-full grid grid-cols-1 md:grid-cols-2 gap-10">
    @for (p of projects; track p.slug; let i = $index) {
      <a
        [routerLink]="['/projects', p.slug]"
        appReveal
        [appRevealDelay]="delayFor(i)"
        class="holo-glass-panel reveal-border-hover flex flex-col block"
      >
        <div class="h-64 w-full bg-surface-container-high relative overflow-hidden group">
          <img
            class="object-cover w-full h-full opacity-80 group-hover:opacity-100 transition-opacity duration-500"
            [src]="p.image"
            [alt]="p.name"
          />
        </div>
        <div class="p-6 flex flex-col grow gap-4">
          <div class="flex justify-between items-start">
            <h2 class="font-display text-2xl font-semibold text-on-surface">{{ p.name }}</h2>
            <app-icon name="open_in_new" extraClass="text-on-surface-variant" />
          </div>
          <p class="font-body text-base text-on-surface-variant grow">
            <strong class="text-on-surface">Problem:</strong> {{ p.problem }}
          </p>
          <div class="flex flex-wrap gap-2 pt-2">
            @for (s of p.stack; track s) {
              <span class="font-label text-sm px-2 py-1 rounded bg-surface-container-lowest text-primary-fixed-dim">{{ s }}</span>
            }
          </div>
        </div>
      </a>
    }
  </section>
</div>
